[package]
name = "sermon-studio"
version = "1.0.0"
edition = "2021"
description = "Sermon Studio — offline expository sermon writing studio"
license = "MIT"

[lib]
name = "sermon_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sermon_core = { path = "../crates/core" }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
