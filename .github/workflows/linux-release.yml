name: Linux Release (deb + AppImage)

on:
  push:
    branches:
      - release/track-q-linux
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout (with LFS for the packaged canon.db)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            libssl-dev \
            xvfb \
            file \
            squashfs-tools \
            libfuse2 \
            dpkg

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build .deb + AppImage
        run: tauri build --bundles deb,appimage
        env:
          CI: 'true'

      - name: Smoke test (.deb install + AppImage launch + canon lookups)
        run: bash scripts/smoke-linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: sermon-studio-linux-v1
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
