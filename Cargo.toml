[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Sermon Studio"]

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled", "functions", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
# Track C: filesystem watcher used as a reconciliation *optimization* only.
# Startup reconciliation remains the correctness mechanism.
notify = "8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep intermediate artifacts small so the full Tauri stack builds within
# constrained disk budgets. Debug symbols are not needed for the shipped app.
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false
